name: Fase 3 - Vigilancia en vivo

# GitHub Actions NO garantiza que un cron cada 5 min corra realmente
# cada 5 min (puede atrasarse o saltarse ejecuciones). Por eso, en vez de
# depender de un cron muy frecuente, este workflow se dispara solo 4
# veces al dia y cada disparo se queda corriendo por dentro ~5.5 horas,
# revisando cada 5 min con un `sleep` propio que no depende de que
# GitHub lo vuelva a agendar. 4 x 5.5h = 22h de cobertura real del dia.
#
# Horarios de disparo (UTC): 00:00, 05:30, 11:00, 16:30
# (equivalen a 19:00, 00:30, 06:00, 11:30 hora local UTC-5)
# Ajusta estos horarios si la mayoria de tus partidos caen fuera de estas
# franjas.
on:
  schedule:
    - cron: "0 0 * * *"
    - cron: "30 5 * * *"
    - cron: "0 11 * * *"
    - cron: "30 16 * * *"
  workflow_dispatch: {}

concurrency:
  group: fase3-monitor
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 345  # 5.75h de margen (limite del loop interno es 5.5h)
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Configurar git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Loop de vigilancia (5.5h, revisa cada 5 min, commitea tras cada revision)
        run: |
          FIN=$((SECONDS + 19800))  # 5.5 horas en segundos
          while [ $SECONDS -lt $FIN ]; do
            echo "=== Revision $(date -u +%H:%M:%S) UTC ==="
            python monitor.py || echo "[AVISO] monitor.py fallo esta vuelta, se reintenta en el siguiente ciclo."

            git add -A data/
            if git diff --cached --quiet; then
              echo "Sin cambios para commitear esta vuelta."
            else
              git commit -m "Fase 3: revision en vivo $(date -u +%H:%M:%S)"
              for i in 1 2 3 4 5; do
                git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break
                echo "Push fallo (intento $i), reintentando en 5s..."
                sleep 5
              done
            fi

            sleep 300
          done
          echo "Ciclo de 5.5h completado."
