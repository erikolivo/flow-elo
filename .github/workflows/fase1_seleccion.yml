name: Fase 1 - Seleccion de partidos

on:
  schedule:
    - cron: "*/5 9-10 * * *"
  workflow_dispatch: {}

concurrency:
  group: fase1-seleccion
  cancel-in-progress: false

jobs:
  seleccionar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar seleccion de partidos
        run: python seleccionar_partidos.py

      - name: Commit y push (con reintento por si choca con otra ejecucion)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p data data/historial_dias
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios para commitear."
          else
            git commit -m "Fase 1: seleccion de partidos del dia"
            for i in 1 2 3 4 5; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break
              echo "Push fallo (intento $i), reintentando en 5s..."
              sleep 5
            done
          fi
