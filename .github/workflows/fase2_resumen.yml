name: Fase 2 - Resumen diario

# Ventana 07:00-08:30 hora local (UTC-5) = 12:00-13:30 UTC.
# Reintenta cada 15 min hasta lograrlo. resumen.py revisa ya_se_hizo("resumen")
# y termina de inmediato si ya se envio hoy.
on:
  schedule:
    - cron: "*/15 12-13 * * *"
  workflow_dispatch: {}

concurrency:
  group: fase2-resumen
  cancel-in-progress: false

jobs:
  resumen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Enviar resumen del dia
        run: python resumen.py

      - name: Commit y push (con reintento)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "Sin cambios para commitear."
          else
            git commit -m "Fase 2: resumen diario enviado"
            for i in 1 2 3 4 5; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break
              echo "Push fallo (intento $i), reintentando en 5s..."
              sleep 5
            done
          fi
